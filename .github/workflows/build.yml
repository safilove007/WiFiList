name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download hidden-API android.jar
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/Reginer/aosp-android-jar/releases/tags/34v2 | grep "browser_download_url.*jar" | head -1 | cut -d '"' -f 4)
          curl -L "$ASSET_URL" -o hidden-android.jar
          cp hidden-android.jar "$ANDROID_HOME/platforms/android-34/android.jar"
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
