name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download hidden-API android.jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir hidden-jar
          gh release download 34v2 --repo Reginer/aosp-android-jar --dir ./hidden-jar
          ls -la ./hidden-jar
          JAR_FILE=$(ls -S ./hidden-jar | head -1)
          cp "./hidden-jar/$JAR_FILE" "$ANDROID_HOME/platforms/android-34/android.jar"
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
