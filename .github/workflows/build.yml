name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download hidden-API android.jar
        run: |
          for name in "android-34.jar" "android34.jar" "android-34/android.jar" "android.jar"; do
            URL="https://raw.githubusercontent.com/Reginer/aosp-android-jar/34v2/$name"
            curl -sL "$URL" -o hidden-android.jar || continue
            SIZE=$(stat -c%s hidden-android.jar 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1000000 ]; then
              break
            fi
          done
          cp hidden-android.jar "$ANDROID_HOME/platforms/android-34/android.jar"
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - name: List output APKs
        run: find app/build/outputs/apk -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
